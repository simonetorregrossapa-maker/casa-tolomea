<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gestione prenotazioni — Casa Tolomea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Pannello gestione: pensato per essere letto da telefono, all'aperto, con una mano.
     Carattere Atkinson Hyperlegible (nato per la leggibilità), testo nero su bianco,
     stati con colore + parole, bersagli da almeno 48px. */
  :root{
    --c-bg:#eef0ec; --c-surface:#ffffff; --c-ink:#14181c; --c-muted:#454c52;
    --c-line:#c3c9c0; --c-accent:#9a3d27; --c-accent-soft:#b9543a; --c-accent-bg:#fbe9e2;
    --c-olive:#34402b; --c-olive-soft:#5d6d4b;
    --c-wait-bg:#ffefb8; --c-wait-ink:#5a4000;
    --c-ok-bg:#d6efd2; --c-ok-ink:#1b4a17;
    --c-no-bg:#e3e5e1; --c-no-ink:#3d4349;
    --font-display:"Atkinson Hyperlegible",system-ui,sans-serif; --font-body:"Atkinson Hyperlegible",system-ui,sans-serif;
    --radius:16px; --shadow-sm:0 1px 3px rgba(20,24,28,.10); --shadow-md:0 12px 30px -10px rgba(20,24,28,.35);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:0;margin:0;line-height:1.2;}
  a{color:var(--c-accent);text-underline-offset:3px;}
  button,a,.adm-chip,.adm-tab{touch-action:manipulation;}
  ::selection{background:var(--c-accent-bg);color:var(--c-ink);}
  :focus-visible{outline:3px solid var(--c-olive);outline-offset:2px;}
  .adm-wrap{max-width:960px;margin:0 auto;padding:20px 16px 90px;}

  .adm-top{margin-bottom:18px;}
  .adm-eyebrow{display:none;}
  .adm-top h1{font-size:clamp(1.55rem,4vw,2.1rem);margin:0 0 4px;}
  .adm-top p{color:var(--c-muted);margin:0;font-size:1rem;}

  .adm-demo-banner{background:var(--c-wait-bg);color:var(--c-wait-ink);border-radius:12px;padding:12px 16px;font-size:.95rem;margin-bottom:16px;}

  /* Login */
  .adm-login{max-width:400px;margin:20px auto;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);}
  .adm-login h2{font-size:1.5rem;margin-bottom:6px;}
  .adm-login label{display:block;font-size:1rem;font-weight:700;margin:16px 0 6px;}
  .adm-login input{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--c-line);border-radius:12px;background:#fff;font-family:var(--font-body);font-size:1.05rem;color:var(--c-ink);}
  .adm-login input:focus{outline:3px solid var(--c-olive);outline-offset:1px;border-color:var(--c-olive);}
  .adm-login .adm-btn{width:100%;margin-top:20px;justify-content:center;}

  /* Pulsanti */
  .adm-btn{display:inline-flex;align-items:center;gap:.4rem;border:2px solid transparent;border-radius:12px;min-height:52px;padding:12px 22px;font-family:var(--font-body);font-size:1.05rem;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;}
  .adm-btn:active{transform:scale(.97);}
  .adm-btn-primary{background:var(--c-accent);color:#fff;}
  .adm-btn-ghost{background:#fff;color:var(--c-ink);border-color:var(--c-ink);}
  .adm-btn-sm{min-height:48px;padding:10px 18px;font-size:1rem;}
  @media (hover:hover) and (pointer:fine){
    .adm-btn-primary:hover{background:#7f301e;}
    .adm-btn-ghost:hover{background:var(--c-accent-bg);}
  }

  /* Barra e schede */
  .adm-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .adm-tabs{display:flex;flex-wrap:wrap;gap:8px;width:100%;}
  .adm-tab{flex:1 1 auto;min-height:48px;border:2px solid var(--c-line);background:var(--c-surface);padding:10px 16px;border-radius:12px;font-family:var(--font-body);font-weight:700;font-size:1.02rem;color:var(--c-ink);cursor:pointer;white-space:nowrap;}
  .adm-tab.sel{background:var(--c-ink);border-color:var(--c-ink);color:#fff;}
  .adm-bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .adm-demo-pill{background:var(--c-wait-bg);color:var(--c-wait-ink);font-size:.9rem;font-weight:700;padding:6px 12px;border-radius:8px;}

  /* Numeri */
  .adm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  .adm-stat{background:var(--c-surface);border:1px solid var(--c-line);border-radius:14px;padding:14px 16px;}
  .adm-stat b{font-family:var(--font-display);font-size:2.1rem;font-weight:700;color:var(--c-ink);display:block;line-height:1.1;font-variant-numeric:tabular-nums;}
  .adm-stat span{font-size:1rem;color:var(--c-muted);line-height:1.3;display:block;margin-top:2px;}
  .adm-stats-4{grid-template-columns:repeat(4,1fr);}
  .adm-stat-accent{background:var(--c-accent-bg);border-color:var(--c-accent);}
  @media(max-width:720px){.adm-stats,.adm-stats-4{grid-template-columns:repeat(2,1fr);}}

  /* Filtri */
  .adm-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .adm-chip{min-height:48px;border:2px solid var(--c-line);background:var(--c-surface);border-radius:12px;padding:10px 16px;font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--c-ink);cursor:pointer;}
  .adm-chip.sel{background:var(--c-olive);color:#fff;border-color:var(--c-olive);}

  /* Richieste */
  .adm-list{display:flex;flex-direction:column;gap:14px;}
  .adm-card{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);}
  .adm-card-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:8px;font-size:1.25rem;}
  .adm-card-dates{font-size:1.1rem;font-weight:700;line-height:1.5;color:var(--c-ink);}
  .adm-card-contacts{font-size:1.05rem;color:var(--c-muted);margin-top:8px;line-height:2;}
  .adm-card-contacts a{display:inline-block;padding:6px 0;font-weight:700;}
  .adm-card-note{font-size:1rem;color:var(--c-muted);margin-top:8px;}
  .adm-dot{color:var(--c-muted);margin:0 6px;}
  .adm-card-actions{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0;}

  .adm-badge{font-size:.95rem;font-weight:700;padding:4px 12px;border-radius:8px;line-height:1.3;}
  .adm-badge.ok{background:var(--c-ok-bg);color:var(--c-ok-ink);}
  .adm-badge.wait{background:var(--c-wait-bg);color:var(--c-wait-ink);}
  .adm-badge.no{background:var(--c-no-bg);color:var(--c-no-ink);}

  /* Richieste sovrapposte: l'avviso deve saltare all'occhio prima del bottone
     "Conferma", perché confermarne due manda l'IBAN a due ospiti. */
  .adm-conflict-bar{background:var(--c-wait-bg);border:2px solid #c99a00;color:var(--c-wait-ink);border-radius:12px;padding:14px 16px;font-size:1.02rem;font-weight:700;line-height:1.5;margin-bottom:16px;}
  .adm-card.is-conflict{border:2px solid #c99a00;}
  .adm-card.is-off{opacity:.7;}
  .adm-card-warn{font-size:1rem;line-height:1.5;color:var(--c-wait-ink);background:var(--c-wait-bg);border-radius:10px;padding:10px 12px;margin:8px 0 6px;}

  .adm-empty{color:var(--c-muted);text-align:center;padding:30px;font-size:1.05rem;}
  .adm-muted{color:var(--c-muted);}

  /* Calendario */
  .adm-cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .adm-cal-head h3{font-size:1.4rem;text-align:center;flex:1;}
  .adm-nav{border:2px solid var(--c-ink);background:var(--c-surface);width:52px;height:52px;border-radius:12px;font-size:1.6rem;line-height:1;color:var(--c-ink);cursor:pointer;}
  .adm-nav:disabled{opacity:.35;}
  .adm-legend{display:flex;gap:10px 18px;justify-content:flex-start;flex-wrap:wrap;margin-bottom:14px;font-size:1rem;color:var(--c-ink);}
  .adm-legend i.lg{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:-3px;margin-right:6px;}
  .lg.site{background:var(--c-olive-soft);}
  .lg.booking{background:var(--c-accent-soft);}
  .lg.both{background:linear-gradient(135deg,var(--c-olive-soft) 50%,var(--c-accent-soft) 50%);}
  .lg.blocco{background:#59606a;}
  .adm-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:16px;padding:12px;box-shadow:var(--shadow-sm);}
  .adm-wd{text-align:center;font-size:.9rem;font-weight:700;color:var(--c-muted);text-transform:uppercase;padding-bottom:4px;}
  .adm-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:1.1rem;font-weight:700;color:var(--c-ink);background:var(--c-bg);font-variant-numeric:tabular-nums;}
  .adm-cell.empty{background:transparent;}
  .adm-cell.site{background:var(--c-olive-soft);color:#fff;}
  .adm-cell.booking{background:var(--c-accent-soft);color:#fff;}
  .adm-cell.both{background:linear-gradient(135deg,var(--c-olive-soft) 50%,var(--c-accent-soft) 50%);color:#fff;}
  .adm-cell.blocco{background:#59606a;color:#fff;}
  .adm-cell.today{outline:3px solid var(--c-ink);outline-offset:-3px;}
  .adm-cal-foot{font-size:1rem;margin-top:14px;color:var(--c-muted);}

  /* Incassi / provvigione */
  .adm-inc-pipeline{background:var(--c-surface);border:1px solid var(--c-line);border-radius:12px;padding:14px 16px;font-size:1.05rem;margin-bottom:18px;}
  .adm-inc-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;font-size:.95rem;font-weight:700;color:var(--c-muted);text-transform:uppercase;border-bottom:2px solid var(--c-line);}
  .adm-inc-cols{display:flex;gap:26px;}
  .adm-inc-cols b{color:var(--c-ink);}
  .adm-inc-list{display:flex;flex-direction:column;}
  .adm-inc-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--c-line);font-size:1.05rem;}
  .adm-inc-when{display:flex;flex-direction:column;gap:3px;}
  .adm-inc-when .adm-muted{font-size:1rem;}
  .adm-inc-money{display:flex;gap:22px;align-items:baseline;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .adm-inc-money b{color:var(--c-ink);font-weight:700;min-width:64px;text-align:right;}
  .adm-inc-money span{color:var(--c-muted);min-width:64px;text-align:right;}

  /* Blocco manuale */
  .adm-block-box{background:var(--c-surface);border:1px solid var(--c-line);border-radius:16px;padding:20px;margin-top:22px;box-shadow:var(--shadow-sm);}
  .adm-block-box h3{font-size:1.3rem;}
  .adm-block-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
  .adm-block-form label{display:flex;flex-direction:column;font-size:1rem;font-weight:700;color:var(--c-ink);gap:6px;flex:1;min-width:140px;}
  .adm-block-form input{min-height:52px;padding:10px 12px;border:2px solid var(--c-line);border-radius:12px;background:#fff;font-family:var(--font-body);font-size:1.05rem;color:var(--c-ink);}
  .adm-block-form input:focus{outline:3px solid var(--c-olive);outline-offset:1px;border-color:var(--c-olive);}
  .adm-block-form .adm-btn{flex:0 0 auto;}
  .adm-blocco-list{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
  .adm-blocco-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--c-bg);border:1px solid var(--c-line);border-radius:12px;font-size:1.02rem;}
  .adm-blocco-row em{color:var(--c-muted);font-style:normal;}

  /* Messaggi ai clienti */
  .adm-msg{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  @media(max-width:820px){.adm-msg{grid-template-columns:1fr;}}
  .adm-msg-box{background:var(--c-surface);border:1px solid var(--c-line);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);}
  .adm-msg-box h3{font-size:1.3rem;margin-bottom:6px;}
  .adm-msg-box .adm-muted{font-size:1rem;margin-bottom:14px;}
  .adm-seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .adm-recipients{max-height:380px;overflow:auto;border:2px solid var(--c-line);border-radius:12px;background:#fff;}
  .adm-recip-row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:1px solid var(--c-line);font-size:1.05rem;cursor:pointer;}
  .adm-recip-row:last-child{border-bottom:none;}
  .adm-recip-row input{width:24px;height:24px;accent-color:var(--c-olive);flex:none;}
  .adm-recip-main{display:flex;flex-direction:column;line-height:1.3;min-width:0;}
  .adm-recip-main b{font-weight:700;}
  .adm-recip-main span{color:var(--c-muted);font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .adm-recip-tag{margin-left:auto;flex:none;font-size:.9rem;font-weight:700;color:var(--c-olive);background:var(--c-bg);border:1px solid var(--c-line);border-radius:8px;padding:3px 10px;}
  .adm-msg-form label{display:block;font-size:1rem;font-weight:700;color:var(--c-ink);margin:14px 0 6px;}
  .adm-msg-form input,.adm-msg-form textarea{width:100%;padding:12px 14px;border:2px solid var(--c-line);border-radius:12px;background:#fff;font-family:var(--font-body);font-size:1.05rem;color:var(--c-ink);}
  .adm-msg-form textarea{min-height:200px;resize:vertical;line-height:1.55;}
  .adm-msg-form input:focus,.adm-msg-form textarea:focus{outline:3px solid var(--c-olive);outline-offset:1px;border-color:var(--c-olive);}
  .adm-msg-count{font-size:1.02rem;color:var(--c-ink);margin:8px 0 0;}
  .adm-msg-count b{color:var(--c-accent);}
  .adm-msg-send{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .adm-msg-preview{margin-top:14px;border:2px dashed var(--c-line);border-radius:12px;padding:16px;background:var(--c-bg);font-size:1.02rem;line-height:1.6;}
  .adm-msg-preview .pv-h{font-family:var(--font-display);color:var(--c-accent);font-size:1.15rem;margin-bottom:8px;}
  .adm-msg-preview .pv-sign{margin-top:12px;color:var(--c-muted);}

  /* Avviso */
  .adm-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--c-ink);color:#fff;padding:14px 22px;border-radius:12px;font-size:1.05rem;font-weight:700;box-shadow:var(--shadow-md);opacity:0;transition:opacity .3s,transform .3s;z-index:99;max-width:92vw;text-align:center;}
  .adm-toast.show{opacity:1;transform:translate(-50%,0);}
  .adm-toast.err{background:#8f2218;}
  .adm-toast.warn{background:var(--c-accent);}

  @media(max-width:640px){
    input,select,textarea{font-size:16px !important;}
    .adm-card{flex-direction:column;align-items:stretch;}
    .adm-card-actions{width:100%;}
    .adm-card-actions .adm-btn{flex:1 1 0;justify-content:center;}
    .adm-tab{flex:1 1 40%;min-height:46px;padding:8px 12px;}
    .adm-tabs{gap:6px;}
    .adm-top p{display:none;}
    .adm-wrap{padding-top:14px;}
    .adm-stat b{font-size:1.9rem;}
    .adm-inc-row{flex-direction:column;align-items:flex-start;}
    .adm-inc-money{width:100%;justify-content:space-between;}
    .adm-block-form .adm-btn{width:100%;justify-content:center;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
  <div class="adm-wrap">
    <div class="adm-top">
      <div class="adm-eyebrow">Area riservata · proprietario</div>
      <h1>Gestione prenotazioni</h1>
      <p>Conferma le richieste dal sito e tieni sotto controllo il calendario, sincronizzato con Booking.</p>
    </div>
    <div class="adm-demo-banner" id="admDemoBanner" hidden>
      Modalità dimostrativa: dati di esempio. Collega Supabase in <code>config.js</code> per usarlo dal vivo.
    </div>
    <div id="admRoot"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
